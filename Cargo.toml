[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
launcher-core = { path = "crates/launcher-core" }
launcher-apps = { path = "crates/launcher-apps" }
launcher-calc = { path = "crates/launcher-calc" }
launcher-jwt = { path = "crates/launcher-jwt" }
base64 = "0.22.1"
# The version numbat uses, so the app links one copy.
jiff = "0.2.46"
notify = "8.2.2"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFError", "CFString", "CFURL"] }
numbat = { version = "1.24.0", default-features = false, features = ["fetch-exchangerates"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
uniffi = "0.32.2"

[profile.release]
lto = "thin"
# Symbols for xctrace; macOS keeps them in target/, not in the bundle.
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = true
