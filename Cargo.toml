[workspace]
members = ["crates/*"]
# Built through `[patch.crates-io]` below; see vendor/numbat/PATCHES.md.
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
launcher-core = { path = "crates/launcher-core" }
launcher-apps = { path = "crates/launcher-apps" }
launcher-calc = { path = "crates/launcher-calc" }
launcher-config = { path = "crates/launcher-config" }
launcher-jwt = { path = "crates/launcher-jwt" }
launcher-kagi = { path = "crates/launcher-kagi" }
launcher-plugins = { path = "crates/launcher-plugins" }
launcher-secret = { path = "crates/launcher-secret" }
launcher-window = { path = "crates/launcher-window" }
# The client numbat's `fetch-exchangerates` uses. That feature is off because it fetches when a
# query first meets a currency, on the UI thread; the calculator fetches and caches rates itself.
attohttpc = { version = "0.32.0", default-features = false, features = ["tls-rustls-webpki-roots"] }
base64 = "0.23.1"
# The version numbat uses, so the app links one copy.
jiff = "1.0.2"
libc = "0.2.191"
notify = "8.2.2"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFError", "CFString", "CFURL"] }
objc2-security = { version = "0.3.2", default-features = false, features = ["SecBase", "SecItem"] }
numbat = { version = "1.24.0", default-features = false }
numbat-exchange-rates = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order`, so a decoded JWT shows its claims in the token's order.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
# Reading only: `display` would add the writer.
toml = { version = "1.2.2", default-features = false, features = ["parse", "serde", "std"] }
uniffi = "0.32.2"
# The version attohttpc uses.
url = "2.5.9"

[patch.crates-io]
numbat = { path = "vendor/numbat/numbat" }
numbat-exchange-rates = { path = "vendor/numbat/numbat-exchange-rates" }

[profile.release]
lto = "thin"
# Symbols for xctrace; macOS keeps them in target/, not in the bundle.
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = true
