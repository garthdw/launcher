name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Rust core and the Swift shell built against it, each with its tests.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Writes the bindings, without which SwiftPM can't load the package.
      - run: scripts/bundle
      # Only `PanelLayout` and its tests: `swift test` alone builds the app again in debug.
      - run: swift build --package-path macos --target PanelLayoutTests
      - run: swift test --package-path macos --skip-build

  # The core is shared with the Linux shell to come. rustfmt checks every file whatever the cfg,
  # so `cargo fmt --check` runs only here.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
